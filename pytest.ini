# Running `pytest` from the repository root used to find no config at all:
# asyncio_mode fell back to strict, so 72 async tests were silently *skipped*
# and the four sync tests that depend on async fixtures failed. A suite that
# reports "89 passed" while quietly not running most of itself is worse than
# one that fails.
#
# The backend's own backend/pytest.ini still applies when pytest is invoked
# from inside backend/, which is what CI does.
[pytest]
testpaths = backend/tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    error
