[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# ASYNC catches blocking calls inside coroutines, S is bandit -- both matter
# in a codebase that is almost entirely async and handles credentials.
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # FastAPI's Depends() in defaults is the framework's own idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]   # asserts and dummy secrets are the point

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = "^(alembic/|tests/)"
plugins = ["pydantic.mypy"]
